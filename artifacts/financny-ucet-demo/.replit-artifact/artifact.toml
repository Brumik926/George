kind = "mobile"
previewPath = "/"
title = "George"
description = "Bezpečná mobilná demo aplikácia osobného účtu s modro-bielym vizuálom, simulovanými prevodmi, históriou príjmov a výdavkov a potvrdeniami označenými ako neplatný vzor."
version = "1.0.0"
id = "artifacts/financny-ucet-demo"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21153

[services.development]
run = "pnpm --filter @workspace/financny-ucet-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/financny-ucet-demo", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/financny-ucet-demo", "run", "serve" ]

[services.env]
PORT = "21153"
BASE_PATH = "/"
